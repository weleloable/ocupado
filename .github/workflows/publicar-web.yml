# Publica la version web de Ocupado en https://weleloable.github.io/ocupado/ en
# cada push a master. La app Ruta de Bares la carga desde ahi (pestana Juegos).
#
# Antes de publicar pasa los tres autotests (partida entera, final secreto y
# mandos tactiles): si alguno falla, no se publica nada.
name: Publicar web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue cada vez; el siguiente espera (cortar uno a medias deja Pages raro).
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Godot y las plantillas web no cambian con el juego: se guardan entre ejecuciones.
      - uses: actions/cache@v4
        id: cache-godot
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web-v1

      - name: Descargar Godot y las plantillas web
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSfL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # Solo las plantillas web (~20 MB) y no el paquete entero (~1,3 GB): ver el script.
          python3 tools/plantillas_web.py "${GODOT_VERSION}" ~/godot/plantillas

      - name: Instalar las plantillas donde las busca Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp ~/godot/plantillas/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          ~/godot/godot --version

      - name: Importar el proyecto
        run: ~/godot/godot --headless --path . --import

      - name: Autotest (partida entera)
        run: ~/godot/godot --headless --path . -- --autotest

      - name: Autotest (final secreto)
        run: ~/godot/godot --headless --path . -- --autotest-flood

      - name: Autotest (mandos tactiles)
        run: ~/godot/godot --headless --path . -- --autotest-tactil

      - name: Exportar a web
        run: |
          mkdir -p export/web
          # Sin esto Godot "importa" las imagenes de la exportacion como si fueran del juego.
          touch export/.gdignore
          ~/godot/godot --headless --path . --export-release "Web" export/web/index.html
          test -s export/web/index.wasm
          test -s export/web/index.pck
          ls -la export/web

      - uses: actions/upload-pages-artifact@v5
        with:
          path: export/web

  publicar:
    needs: exportar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
